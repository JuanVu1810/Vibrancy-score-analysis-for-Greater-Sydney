services:
  # PostgreSQL with the PostGIS extension. The password must come from an ignored .env file.
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64          # the image is amd64-only; emulated on Apple Silicon
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-postgres}
    ports:
      # 5433 on the host so it does not clash with a Postgres already on 5432.
      # Keep the database inaccessible from other machines even when a strong password is used.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Runs the notebook and checks the results:  docker compose run --rm runner
  runner:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
      DB_NAME: ${DB_NAME:-postgres}
    volumes:
      - .:/work
    working_dir: /work
    command: ["bash", "scripts/run.sh"]

  # Cleans the files in raw/ (from download_data.py) and loads them into the "v2" schema:  docker compose run --rm etl
  # Other commands:  docker compose run --rm --no-deps etl run --no-db   (files only, no database)
  # The download step:  docker compose run --rm --no-deps --user "$(id -u):$(id -g)" --entrypoint python etl download_data.py
  etl:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
      DB_NAME: ${DB_NAME:-postgres}
      TFNSW_API_KEY: ${TFNSW_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets --db-host host.docker.internal reach a PostgreSQL on your computer
    volumes:
      - .:/work
    working_dir: /work
    entrypoint: ["bash", "scripts/etl.sh"]
    command: ["run"]

volumes:
  pgdata:
